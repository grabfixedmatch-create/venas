name: Daily WordPress Post

on:
  schedule:
    - cron: '0 4 * * *'  # daily at 08:00 UTC
  workflow_dispatch:

concurrency:
  group: daily-wordpress-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai cloudscraper

      - name: Run scraper
        run: python venas.py
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}  # optional, can be left unset
